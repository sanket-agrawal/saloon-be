services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - api
    restart: always
    networks:
      - saloon-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://saloon:${DB_PASSWORD}@postgres:5432/saloon_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY}
      - EXOTEL_API_KEY=${EXOTEL_API_KEY}
      - EXOTEL_API_TOKEN=${EXOTEL_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - saloon-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["node", "dist/jobs/worker.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://saloon:${DB_PASSWORD}@postgres:5432/saloon_db
      - REDIS_URL=redis://redis:6379
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY}
      - EXOTEL_API_KEY=${EXOTEL_API_KEY}
      - EXOTEL_API_TOKEN=${EXOTEL_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    networks:
      - saloon-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saloon_db
      POSTGRES_USER: saloon
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saloon -d saloon_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - saloon-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - saloon-network

  bull-board:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["node", "dist/jobs/board.js"]
    environment:
      - REDIS_URL=redis://redis:6379
      - BULL_BOARD_PORT=3001
    depends_on:
      - redis
    restart: always
    networks:
      - saloon-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  saloon-network:
    driver: bridge
